name: Veille documentaire BRVM publique
on:
  schedule:
    - cron: '40 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brvm-public-watch
  cancel-in-progress: false
jobs:
  public-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le parseur sans réseau
        run: python -m unittest discover -s tests -p 'test_public_watch.py'
      - name: Collecter exclusivement des liens documentaires officiels
        run: python scripts/update_public_watch.py
      - name: Mettre à jour le catalogue public
        run: |
          git config user.name "brvm-public-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/public-watch.json
          if ! git diff --cached --quiet; then
            git commit -m "data: liens officiels BRVM publics (sans cours ni données privées)"
            git push origin HEAD:main
          fi
