name: BRVM Family — CI et confidentialité
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  finance-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dépendance de rendu de l’icône
        run: python -m pip install cairosvg==2.8.2
      - name: Contrôle des fichiers, tests et build
        run: |
          python scripts/privacy_check.py
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build.py dist
          python scripts/privacy_check.py --dist dist
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Tests Chromium fictifs
        run: |
          python -m pip install playwright==1.62.0 cairosvg==2.8.2
          python scripts/build_icons.py
          python -m playwright install --with-deps chromium
          python tests/browser_e2e.py
      - name: Capture écran fictive pour revue ergonomique
        uses: actions/upload-artifact@v4
        with:
          name: BRVM-Family-V3-Visuel-Mobile-Fictif
          path: test_artifacts/
          retention-days: 30
          if-no-files-found: error
  public-watch-smoke:
    name: Collecte publique BRVM depuis GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Vérifier la collecte réelle et le schéma sans exposer des cours
        run: |
          python scripts/update_public_watch.py
          python -m unittest discover -s tests -p 'test_public_watch.py'
  package:
    name: Archive distribuable vierge
    needs: [finance-and-privacy, browser, public-watch-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dépendance de rendu de l’icône
        run: python -m pip install cairosvg==2.8.2
      - name: Construire et auditer le paquet distribué
        run: |
          python scripts/build.py dist
          python scripts/privacy_check.py --dist dist
      - name: Archive de distribution PWA sans données privées
        uses: actions/upload-artifact@v4
        with:
          name: BRVM-Family-V3-PWA-vierge
          path: dist/
          retention-days: 30
          if-no-files-found: error
