name: Publication BRVM Family — GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Tests et build sans données personnelles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérification de confidentialité et tests financiers
        run: |
          python scripts/privacy_check.py
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build.py dist
          python scripts/privacy_check.py --dist dist
      - name: Recette Chromium sur données fictives
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/browser_e2e.py
      - name: Préparer les fichiers statiques
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Héberger avec GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publier le shell vérifié
        id: deployment
        uses: actions/deploy-pages@v4
