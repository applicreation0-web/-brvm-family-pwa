plugins {
    id 'com.android.application'
}

android {
    namespace 'org.brvmfamily.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.brvmfamily.app'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '3.6.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('prepareOfflineWeb', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'scripts/build_android.py'
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareOfflineWeb')
}
